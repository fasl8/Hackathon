<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درع الأمان الذكي — محاكاة محلية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#e9edf0;--card:#fff;--scr:#f7f9fa;--ink:#14212b;--mut:#5b6b78;--line:#d3dae0;--acc:#0e7c86;--accs:#d9eff1;--red:#b3261e;--reds:#fbe1de;--amb:#8a4b08;--ok:#2d7a4b;--oks:#dff1e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1116;--card:#151f28;--scr:#131d25;--ink:#e6edf2;--mut:#93a4b1;--line:#2b3a46;--acc:#4cc3cd;--accs:#133a40;--red:#c9392f;--reds:#3a1a18;--amb:#a85f10;--ok:#6fd195;--oks:#16331f}}
:root[data-theme="dark"]{--bg:#0b1116;--card:#151f28;--scr:#131d25;--ink:#e6edf2;--mut:#93a4b1;--line:#2b3a46;--acc:#4cc3cd;--accs:#133a40;--red:#c9392f;--reds:#3a1a18;--amb:#a85f10;--ok:#6fd195;--oks:#16331f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6}
nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
nav a{color:var(--ink);text-decoration:none;padding:5px 12px;border-radius:8px;border:1px solid var(--line);font-size:.88rem}
nav a[aria-current]{background:var(--acc);border-color:var(--acc);color:#fff}
#chip{margin-inline-start:auto;font-size:.82rem;color:var(--mut)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:16px;flex-wrap:wrap}
#app .ph{flex:0 0 auto}
#app .ct{flex:1 1 560px;max-width:900px;min-width:0}
body[data-view=phone] .ct,body[data-view=police] .ph{display:none}
.phone{width:min(100vw - 32px,390px);height:740px;background:var(--scr);border:8px solid #1c2630;border-radius:40px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:.78rem;color:var(--mut)}
.app{flex:1;overflow-y:auto;padding:8px 16px 16px}
.app h1{font-size:1.1rem;margin:4px 0}
.st{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin:8px 0;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.sec{font-size:.82rem;color:var(--mut);margin:12px 0 6px}
.sms{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.88rem}
.sms a{color:var(--acc);direction:ltr;display:inline-block}

.cnt{font-size:.84rem;color:var(--mut);text-align:center;margin-top:10px}
.al{position:absolute;inset:0;background:var(--red);color:#fff;padding:24px 20px 20px;display:none;flex-direction:column;z-index:5}
.al.bc{background:var(--amb)}
.al.on{display:flex}
.al.shake{animation:sh .5s 2}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.al.shake{animation:none}.bar i{transition:none}}
.al .tp{font-size:.82rem;opacity:.92}
.al h2{font-size:1.45rem;margin:2px 0 8px;line-height:1.35}
.al .why{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;margin:6px 0 12px;font-size:.9rem}
.al ul{margin:6px 0 0;padding-inline-start:20px}
.al .sp{flex:1}
.b1{background:#fff;color:#7a1a14;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;width:100%;cursor:pointer}
.b2{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:11px;font:inherit;width:100%;margin-top:8px;cursor:pointer}
.b2:disabled{opacity:.5}
.toast{position:absolute;bottom:16px;inset-inline:14px;background:#1c2630;color:#fff;border-radius:14px;padding:10px 14px;font-size:.86rem;display:none;z-index:6}
.toast.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.kp{grid-template-columns:repeat(2,1fr)}}
.kp b{font-size:1.5rem;display:block;line-height:1.2}
.kp span{color:var(--mut);font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.tg{padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--accs);color:var(--acc)}
.tg.r{background:var(--reds);color:var(--red)}
.tg.g{background:var(--oks);color:var(--ok)}
.feed{height:210px;overflow-y:auto;font-size:.86rem}
.ev{padding:5px 0;border-bottom:1px dashed var(--line)}
.ev time{color:var(--mut);font-size:.76rem;margin-inline-end:8px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.note{font-size:.8rem;color:var(--mut)}
.scanbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0 12px}
.scanbox label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:6px}
.scanbox input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--scr);color:var(--ink);font:inherit;direction:ltr;text-align:left}
.scan-btn{width:100%;margin-top:8px;background:var(--acc);color:#fff;border:0;border-radius:9px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer}
.scan-btn:disabled{opacity:.6;cursor:wait}
.scan-status{font-size:.85rem;margin-top:9px;white-space:pre-wrap;overflow-wrap:anywhere}
.scan-result{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--scr);margin-top:8px}
.scan-result.danger{border-color:var(--red);background:var(--reds)}
.scan-result.ok{border-color:var(--ok);background:var(--oks)}
.scan-result b{display:block;margin-bottom:4px}
.scan-result p{margin:4px 0;font-size:.82rem}
.scan-result ul{margin:5px 0 0;padding-inline-start:20px;font-size:.82rem}

.ai-panel textarea,.ai-panel input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--scr);color:var(--ink);font:inherit;margin:4px 0 9px}
.ai-panel textarea{min-height:112px;resize:vertical;direction:rtl;text-align:right}
.ai-panel input{direction:ltr;text-align:left}
.ai-panel label{display:block;font-size:.82rem;color:var(--mut);margin-top:5px}
.ai-panel .ai-result{border:1px solid var(--line);border-radius:10px;background:var(--scr);padding:11px;margin-top:10px}
.ai-panel .ai-result.high{border-color:var(--red);background:var(--reds)}
.ai-panel .ai-result.low{border-color:var(--ok);background:var(--oks)}
.ai-panel .ai-result p{font-size:.86rem;margin:6px 0}
.ai-panel .ai-result ul{font-size:.84rem;margin:5px 0;padding-inline-start:20px}
.ai-panel .ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.soc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.soc-header h1{font-size:1.3rem;margin:0}
.soc-demo{display:inline-flex;align-items:center;border-radius:99px;background:var(--amb);color:#fff;padding:3px 10px;font-size:.78rem;font-weight:700}
.soc-updated{font-size:.78rem;color:var(--mut)}
.soc-tabs{display:flex;gap:8px;margin-bottom:12px}
.soc-tabs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.soc-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.soc-controls input,.soc-controls select,.soc-broadcast select,.soc-broadcast textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--scr);color:var(--ink)}
.soc-controls input{flex:1 1 240px;min-width:0}
.soc-table-wrap{overflow-x:auto}
.soc-table{min-width:800px}
.soc-table td{vertical-align:top}
.soc-link{direction:ltr;text-align:left;overflow-wrap:anywhere;display:inline-block}
.soc-campaigns{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.soc-campaign{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--scr)}
.soc-campaign b,.soc-campaign span{display:block}
.soc-campaign span{font-size:.8rem;color:var(--mut)}
.soc-risk{font-weight:700}
.soc-risk.critical,.soc-risk.high{color:var(--red)}
.soc-risk.medium{color:var(--amb)}
.soc-risk.low{color:var(--ok)}
.soc-broadcast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.soc-broadcast label{display:block;font-size:.83rem;color:var(--mut)}
.soc-broadcast select,.soc-broadcast textarea{width:100%;margin-top:4px}
.soc-broadcast textarea{min-height:75px;resize:vertical}
.soc-broadcast .wide{grid-column:1/-1}
.soc-broadcast-status{padding:9px;border-radius:8px;background:var(--accs);color:var(--ink);font-size:.86rem}
.device-manager{width:390px;max-width:100%}
.device-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.device-settings label{display:block;font-size:.83rem;color:var(--mut)}
.device-settings .wide{grid-column:1/-1}
.device-settings input,.device-settings select{width:100%;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--scr);color:var(--ink);font:inherit}
.device-history{max-height:210px;overflow-y:auto;margin-top:12px}
.device-history h3{font-size:.9rem;margin:0 0 6px}
.device-banner{display:grid;gap:2px;background:var(--accs);border-radius:9px;padding:8px 10px;margin:6px 0}
.device-banner small{color:var(--mut)}
.device-inbox{padding:10px 12px;margin:8px 0}
.device-inbox h2{font-size:.92rem;margin:0 0 7px}
.device-inbox-item{border:1px solid var(--line);border-radius:9px;padding:9px;margin:7px 0;background:var(--scr)}
.device-inbox-item.unread{border-color:var(--acc);background:var(--accs)}
.device-inbox-item p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.device-inbox-item time{font-size:.75rem;color:var(--mut)}
.device-inbox-item button{margin-top:5px}
.phone-instance[hidden]{display:none}
.soc-devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.soc-device-state{font-size:.8rem;color:var(--mut);margin-top:4px}
.soc-device-state.active{color:var(--ok);font-weight:700}
@media(max-width:620px){.soc-broadcast{grid-template-columns:1fr}.soc-broadcast .wide{grid-column:auto}.soc-tabs{flex-wrap:wrap}}
@media(max-width:620px){.device-settings{grid-template-columns:1fr}.device-settings .wide{grid-column:auto}}

/* Formal visual system */
:root{--bg:#eef3f7;--card:#fff;--scr:#f8fafc;--ink:#172635;--mut:#647789;--line:#d9e2ea;--acc:#126b66;--accs:#e4f2ef;--red:#b42318;--reds:#fff0ee;--amb:#8a5708;--ok:#19734a;--oks:#e8f5ed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101923;--card:#17232f;--scr:#131e29;--ink:#edf3f8;--mut:#9aabba;--line:#2a3a49;--acc:#48b8ad;--accs:#173b3a;--red:#f27670;--reds:#422423;--amb:#e3aa5e;--ok:#65ce94;--oks:#193d2d}}

body{min-height:100vh;background:radial-gradient(ellipse at 85% 0,rgba(18,107,102,.08),transparent 34rem),var(--bg);font-size:15px}

<body data-view="demo">
<nav><a href="#demo">عرض مزدوج</a><a href="#phone">نسخة الهاتف</a><a href="#police">نسخة الكمبيوتر (المركز)</a><span id="chip">…</span></nav>
<div id="app"><div class="ph" id="ph"></div><div class="ct" id="ct"></div></div>

<script>
(function(){
var view=(location.hash||'#demo').slice(1);
if(!/^(demo|phone|police)$/.test(view))view='demo';
document.body.dataset.view=view;
document.querySelectorAll('nav a').forEach(function(a){if(a.getAttribute('href')==='#'+view)a.setAttribute('aria-current','page')});
window.addEventListener('hashchange',function(){location.reload()});

var chip=document.getElementById('chip');
chip.textContent='سجلات مؤقتة للجلسة · لا اتصال بأجهزة حقيقية';

/* ---------- Mock Database: local browser storage, no remote device connection ---------- */
var MOCK_DB_KEY='scamshield_phone_instances_v1';
var DEVICE_REGIONS=['غير محددة','أبوظبي','دبي','الشارقة','العين','عجمان','الفجيرة','رأس الخيمة','أم القيوين'];
var DEFAULT_DEVICES=[
 {id:'DEMO-PHONE-01',name:'هاتف تجريبي 1'},
 {id:'DEMO-PHONE-02',name:'هاتف تجريبي 2'},
 {id:'DEMO-PHONE-03',name:'هاتف تجريبي 3'},
 {id:'DEMO-PHONE-04',name:'هاتف تجريبي 4'},
 {id:'DEMO-PHONE-05',name:'هاتف تجريبي 5'}
];
var mockDbListeners=[],mockStorageAvailable=true;
function freshMockDatabase(){
 return {version:1,nextReport:1,nextNotification:1,devices:DEFAULT_DEVICES.map(function(device){return {id:device.id,name:device.name,location:'غير محددة',enabled:false,activityCount:0,stoppedCount:0,generation:0,notifications:[]}}),reports:[],broadcasts:[]};
}
function mockStorageWarning(message,error){
 mockStorageAvailable=false;chip.textContent=message;
 if(error)console.error('Mock database storage error',error);
}
function loadMockDatabase(){
 var raw;
 try{raw=window.localStorage.getItem(MOCK_DB_KEY)}catch(error){mockStorageWarning('بيانات مؤقتة لهذه الجلسة فقط · التخزين المحلي غير متاح',error);return freshMockDatabase()}
 if(!raw)return freshMockDatabase();
 var saved;
 try{saved=JSON.parse(raw)}catch(error){mockStorageWarning('تعذرت قراءة قاعدة البيانات التجريبية · بدأت جلسة مؤقتة جديدة',error);return freshMockDatabase()}
 if(!saved||saved.version!==1||!Array.isArray(saved.devices)||!Array.isArray(saved.reports)){
  mockStorageWarning('بيانات قاعدة البيانات التجريبية غير صالحة · بدأت جلسة مؤقتة جديدة');
  return freshMockDatabase();
 }
 var restored=freshMockDatabase();
 restored.nextReport=Number.isInteger(saved.nextReport)&&saved.nextReport>0?saved.nextReport:1;

 if(scope!=='all'&&!targetValue){$('.soc-broadcast-status').textContent='يُرجى تحديد منطقة أو جهاز.';return}
 var matched=mockDatabase.devices.filter(function(device){return scope==='all'||(scope==='region'&&device.location===targetValue)||(scope==='device'&&device.id===targetValue)}),recipients=matched.filter(function(device){return device.enabled}),timestamp=new Date().toISOString();
 recipients.forEach(function(device){device.notifications.unshift({id:'MOCK-MESSAGE-'+String(mockDatabase.nextNotification++).padStart(5,'0'),message:message,timestamp:timestamp,read:false});device.notifications=device.notifications.slice(0,50)});
 var item={timestamp:timestamp,target:target,message:message,deliveredCount:recipients.length,skippedCount:matched.length-recipients.length};
 mockDatabase.broadcasts.unshift(item);notifyMockDatabase();
 $('.soc-broadcast-status').textContent=recipients.length?'وصل التنبيه داخل المحاكاة إلى '+recipients.length+' جهاز نشط'+(item.skippedCount?'، وتم تجاوز '+item.skippedCount+' جهاز متوقف':'')+'. لا يصل إلى هاتف فعلي خارج المتصفح.':matched.length?'لم يصل التنبيه؛ لا توجد أجهزة نشطة ضمن النطاق. يلزم تشغيل الأجهزة المستهدفة أولاً.':'لم يصل التنبيه؛ لا توجد أجهزة ضمن النطاق المحدد.';
});
subscribeMockDatabase(render);
render();
